plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nomadllm'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.nomadllm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Gemini Nano through ML Kit GenAI Prompt API (AICore). Beta: devices without
  // AICore report "unsupported"/"deviceNotEligible" at runtime.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}
