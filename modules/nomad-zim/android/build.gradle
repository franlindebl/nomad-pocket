plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nomadzim'
version = '0.1.0'

android {
  namespace "expo.modules.nomadzim"
  defaultConfig {
    consumerProguardFiles 'consumer-rules.pro'
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // libkiwix + libzim JNI bindings (arm64-v8a, armeabi-v7a, x86, x86_64; minSdk 24).
  implementation 'org.kiwix:libkiwix:2.7.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
  // FileProvider, to hand a PDF to the system viewer.
  implementation 'androidx.core:core:1.13.1'
  // PDF text for the library's document index (Apache-2.0). Bouncy Castle is only needed for
  // certificate-encrypted PDFs; password-less RC4/AES ones decrypt with javax.crypto.
  implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
    exclude group: 'org.bouncycastle'
  }
}
