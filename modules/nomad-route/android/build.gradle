plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nomadroute'
version = '0.1.0'

android {
  namespace "expo.modules.nomadroute"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Valhalla routing engine (Rallista valhalla-mobile, MIT; arm64-v8a + x86_64, minSdk 24).
  // Keep the version in step with modules/nomad-route/scripts/fetch-ios-libs.sh.
  implementation 'io.github.rallista:valhalla-mobile:0.6.4'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
