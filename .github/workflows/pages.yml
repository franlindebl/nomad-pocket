name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site/donate.mjs', 'scripts/site/donations.mjs', '.github/workflows/pages.yml']
  # Hourly, so the donations counter stays current; it deploys only when the figures or the day changed
  # (scripts/site/donations.mjs).
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Fills the counter into the checked-out pages and writes site/donations.json; never fails the deploy.
      - name: Donations counter
        id: counter
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/site/donations.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      - if: github.event_name != 'schedule' || steps.counter.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'schedule' || steps.counter.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: github.event_name != 'schedule' || steps.counter.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
