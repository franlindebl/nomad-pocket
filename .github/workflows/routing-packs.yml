name: Routing packs

# Offline routing packs (docs/MAPS_NAVIGATION_PLAN.md, phase 2): one Valhalla build per
# country of scripts/routing/packs.json, region packs cut from it, emergency points per
# pack, published as assets of a release `routing-YYYYMMDD-N`. The app reads the catalog
# from the fixed release `routing-index` (routing-manifest.json), updated last, so it
# only ever points at a complete release; releases no manifest points at are then pruned.

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Country ids from scripts/routing/packs.json, space separated (empty: all)'
        required: false
        default: ''
  schedule:
    - cron: '0 3 5 * *' # monthly, after Geofabrik's daily extracts settle

permissions:
  contents: write

concurrency:
  group: routing-packs
  cancel-in-progress: false

env:
  # Must match the engine the app embeds (modules/nomad-route: valhalla-mobile 0.6.4).
  VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:3.9.1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.plan.outputs.countries }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT: ${{ github.event.inputs.countries }}
        run: |
          countries=$(python3 -I -c 'import json, sys; all = list(json.load(open("scripts/routing/packs.json"))["countries"]); want = sys.argv[1].split(); bad = [c for c in want if c not in all]; sys.exit(f"unknown: {bad}") if bad else print(json.dumps(want or all))' "$INPUT")
          echo "countries=$countries" >> "$GITHUB_OUTPUT"
          # One tag per run: a re-run never replaces files the live manifest points at.
          echo "release=routing-$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.release }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Routing packs $TAG" \
            --notes "Offline routing packs (Valhalla 3.9.1 tiles) and emergency points. Data © OpenStreetMap contributors, ODbL."

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        country: ${{ fromJson(needs.plan.outputs.countries) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/routing && sudo chown "$(id -u):$(id -g)" /mnt/routing
          df -h / /mnt
      - name: Build packs
        run: |
          docker run --rm -e CONC=4 -v "$PWD:/repo:ro" -v /mnt/routing:/work "$VALHALLA_IMAGE" bash -c \
            "apt-get update -qq && apt-get install -y -qq osmium-tool python3-pyosmium >/dev/null && bash /repo/scripts/routing/build-country.sh ${{ matrix.country }} /work/build && chown -R $(id -u):$(id -g) /work"
          ls -la /mnt/routing/build/out
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release }}
        run: |
          cd /mnt/routing/build/out
          # Exactly the files the fragment lists (it drops empty packs and point files).
          python3 -I -c 'import json, sys; [print(f["name"]) for p in json.load(open(sys.argv[1])) for f in p["parts"] + ([p["pois"]] if p["pois"] else [])]' \
            "${{ matrix.country }}.packs.json" | xargs gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: packs-${{ matrix.country }}
          path: /mnt/routing/build/out/${{ matrix.country }}.packs.json

  publish:
    needs: [plan, build]
    # Publish what was built even if one country failed; the others keep last month's.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          path: fragments
          merge-multiple: true
      - name: Manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release }}
        run: |
          ls fragments/*.packs.json || { echo "no country built"; exit 1; }
          # Countries not rebuilt this time keep their entries (and files) from the current manifest.
          # If the index exists, its manifest must be read: else a partial run would drop
          # every country it did not rebuild.
          if gh release view routing-index >/dev/null 2>&1; then
            gh release download routing-index --pattern routing-manifest.json --dir previous
          fi
          python3 -I scripts/routing/manifest.py merge "$TAG" fragments/*.packs.json > routing-manifest.json
          if [ -f previous/routing-manifest.json ]; then
            python3 -I scripts/routing/manifest.py carry previous/routing-manifest.json routing-manifest.json > merged.json
            mv merged.json routing-manifest.json
          fi
          gh release upload "$TAG" --clobber routing-manifest.json
          gh release view routing-index >/dev/null 2>&1 || gh release create routing-index --prerelease \
            --title "Routing catalog" --notes "routing-manifest.json: the current offline routing packs (read by the app)."
          gh release upload routing-index --clobber routing-manifest.json
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep every release the new manifest points at, plus those of the previous one
          # (a phone may still be downloading with the catalog it cached); runs that never
          # reached the manifest go too.
          keep=$(python3 -I -c 'import json, sys; print("\n".join(sorted({p["release"] for f in sys.argv[1:] for p in json.load(open(f))["packs"]})))' \
            routing-manifest.json $(ls previous/routing-manifest.json 2>/dev/null))
          echo "keeping: $keep"
          gh release list --limit 500 --json tagName --jq '.[].tagName' | grep -E '^routing-[0-9]{8}-[0-9]+$' | while read -r tag; do
            grep -qxF "$tag" <<<"$keep" || { echo "deleting $tag"; gh release delete "$tag" --yes --cleanup-tag; }
          done
