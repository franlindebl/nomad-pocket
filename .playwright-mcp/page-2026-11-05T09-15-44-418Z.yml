              - button "Ver más información en Información de la aplicación" [ref=e154] [cursor=pointer]:
                - generic [aria-hidden] [ref=e155]: arrow_forward
            - generic [ref=e156]:
              - generic: "Theri.App es la comunidad para quienes aman a los animales. Descubre tu espíritu animal, enseña a los animales de tu vida y conoce a gente que comparte tu pasión. El nombre viene del griego «therion»: animal salvaje. DESCUBRE TU ESPÍRITU ANIMAL Haz un test de personalidad de 10 preguntas y descubre cuál de más de 100 animales encaja con tu forma de ser. Lobo, zorro, gato, búho, delfín, dragón: cada resultado viene con su propio perfil de personalidad para leer y compartir. TU CARTA ANIMAL Consigue una carta única con tu animal, tu nivel y tu rareza. Compártela con un código QR, descárgala o publícala donde quieras. Según subes de nivel, tu carta evoluciona de Común a Rara, Épica y Legendaria. ENSEÑA A TUS ANIMALES Añade fotos a tu perfil: tu perro, tu gato, los pájaros de tu jardín, tus dibujos. Cuéntanos qué te trae (mascotas, fauna, arte animal) y te sugerimos packs a tu medida. ÚNETE A UN PACK Los packs son chats de grupo sobre un tema: mascotas, fauna, arte animal y muchos más. Crea el tuyo o únete a uno, con su propio chat y acceso a los juegos. Los packs públicos están abiertos a todo el mundo; los privados, solo con invitación. COLECCIÓNALAS TODAS Escanea el código QR de otros miembros para llenar tu álbum. Cada carta guarda el momento en que os conocisteis. 6 JUEGOS PARA JUGAR JUNTOS • Moonlit Hunt: un bosque 3D a la luz de la luna. Recoge orbes, marca árboles ancestrales y caza bajo la luna. Hasta 20 jugadores, o en solitario • Alpha Vote: aparece un «¿quién es más probable que…?» y todo el mundo vota • El Infiltrado Humano: todos comparten un bioma secreto menos un espía. Descubre al impostor • Adivina la Palabra: pistas de una palabra, sin repetidas. Sé creativo • Pack Draw: uno dibuja y el resto corre a adivinar • Pack Puzzle: recompón la imagen desordenada contra el reloj CHAT, LLAMADAS E HISTORIAS Escribe a tus amigos o habla con todo tu pack en tiempo real, y empieza una llamada de grupo desde el propio chat. Las conversaciones nuevas llegan como solicitud, así que tú decides quién puede escribirte. Publica historias con fotos para todo el mundo, para tus packs o solo para amigos; desaparecen a las 48 horas. SUBE DE NIVEL Gana XP coleccionando cartas, jugando y compartiendo historias, y mira en qué puesto quedas en los rankings. TIENDA ANIMAL Explora productos para amantes de los animales que la comunidad encuentra y vota: regalos, accesorios, arte y más. SEGURA DESDE EL DISEÑO Los miembros de 13 a 17 años y los adultos de 18+ tienen espacios separados, y el contenido se modera a todas horas. TAMBIÉN PARA COMUNIDADES Therians, furries y otherpaws también tienen aquí sus propios packs. ¿Ya conoces tu sona? Sáltate el test y elige tu especie directamente."
