# HOME-01 — Home: emergency actions, the preparation checklist (the seeded Wikipedia counts,
# the map of the chosen country is missing) and the storage line; the tabs open.
appId: com.fjlinde.nomadpocket
tags: [smoke, home, seeded]
---
- runFlow: ../../subflows/launch.yaml
- assertVisible: { id: "home-emergency" }
- assertVisible: { id: "home-first-aid" }
- assertVisible: { id: "home-plan" }
- assertVisible: "Llamar al 112"
- takeScreenshot: 01-home-seeded
- scrollUntilVisible:
    element: { id: "ready-map" }
    direction: DOWN
- assertVisible: "(?s).*Mapa de España.*Descárgalo.*"
- scrollUntilVisible:
    element: "Usas .*"
    direction: DOWN
- takeScreenshot: 02-checklist
# The map row leads to the country download.
- tapOn: { id: "ready-map" }
- extendedWaitUntil:
    visible: { id: "country-download" }
    timeout: 15000
- assertVisible: "España"
- swipe: { direction: DOWN }
- tapOn: { id: "books.vertical" }
- assertVisible: "En tu dispositivo|EN TU DISPOSITIVO"
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: "Descarga el mapa de tu país"
    timeout: 15000
- tapOn: { id: "sparkles" }
- assertVisible: "Elige un modelo para empezar|¿En qué te ayudo\\?"
