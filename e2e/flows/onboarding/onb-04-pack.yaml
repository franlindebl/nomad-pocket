# ONB-04 — a kit for another country (Andorra, from the local catalogs) with the survival
# guides starts real downloads; the last step reports them and Home shows the progress.
# Cancels them after.
appId: com.fjlinde.nomadpocket
tags: [nightly, onboarding, network, routing-server, maps-server]
---
- launchApp
- extendedWaitUntil:
    visible: { id: "onboarding-start" }
    timeout: 20000
- tapOn: { id: "onboarding-start" }
- tapOn: "Buscar un país"
- inputText: "Andorra"
- tapOn: { id: "country-ad" }
# The wizard's buttons stay above the keyboard (Maestro's hideKeyboard taps whatever is below).
- tapOn: { id: "onboarding-next" }
- extendedWaitUntil:
    visible: "Mapa de Andorra.*"
    timeout: 20000
# Keep the map and the guides; Wikipedia off (gigabytes). The assistant may be the
# system one ("Incluido", not a download) or a model: switch it off either way.
- tapOn: { id: "kit-wikipedia" }
- tapOn: { id: "kit-assistant" }
- extendedWaitUntil:
    visible: "Descargar · .*"
    timeout: 20000
- takeScreenshot: 01-kit
- tapOn: { id: "onboarding-download" }
- extendedWaitUntil:
    visible: "Tu contenido se está descargando"
    timeout: 20000
- takeScreenshot: 02-ready-downloads
- tapOn: { id: "onboarding-finish" }
- assertVisible: { id: "home-downloads" }
- tapOn: "Descargas"
- assertVisible: "Pausar|Cancelar"
- takeScreenshot: 03-queue
- repeat:
    while:
      visible: "Cancelar"
    commands:
      - tapOn: "Cancelar"
- extendedWaitUntil:
    visible: "No hay descargas activas"
    timeout: 60000
