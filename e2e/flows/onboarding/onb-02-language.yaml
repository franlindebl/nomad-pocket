# ONB-02 — the wizard in English, back to Spanish; reopened from Settings ("Revisar
# descargas recomendadas"). Content languages follow the app language (no choice in the wizard any more).
appId: com.fjlinde.nomadpocket
tags: [full, onboarding]
---
- launchApp
- extendedWaitUntil:
    visible: { id: "onboarding-start" }
    timeout: 20000
- tapOn: "English"
- assertVisible: "Your kit for when the internet is gone"
- assertVisible: "Get started"
- takeScreenshot: 01-english
- tapOn: "Español"
- assertVisible: "Tu kit para cuando no haya internet"
- runFlow: ../../subflows/finish-onboarding.yaml
- tapOn: { id: "open-settings" }
- scrollUntilVisible:
    element: "Revisar descargas recomendadas"
- tapOn: "Revisar descargas recomendadas"
- assertVisible: "Tu kit para cuando no haya internet"
