# MAP-05 — the world basemap (z0–5, ~15 MB) downloads and the map renders it.
appId: com.fjlinde.nomadpocket
tags: [nightly, maps, network]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: "Descargar mapa del mundo.*"
    timeout: 20000
- tapOn: "Descargar mapa del mundo.*"
- extendedWaitUntil:
    visible: "Descargar · .*"
    timeout: 30000
- tapOn: "Descargar · .*"
- extendedWaitUntil:
    visible: "Instalado"
    timeout: 180000
- swipe: { direction: DOWN }
- assertNotVisible: "Mapas que funcionan en cualquier sitio"
- takeScreenshot: 01-world-rendered
