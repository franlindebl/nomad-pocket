# MAP-01 + MAP-02 — no country downloaded: the bundled world map shows, the empty card
# offers the phone's country; "Tus mapas" lists the world as included; saved places sheet.
appId: com.fjlinde.nomadpocket
tags: [smoke, maps]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: "Descarga el mapa de tu país"
    timeout: 20000
- assertVisible: "Descargar España"
- assertVisible: "Elegir un país"
- takeScreenshot: 01-maps-empty
- tapOn: "Tus mapas"
- assertVisible: "Mapa básico del mundo.*"
- assertVisible: "(?s).*Incluido.*"
- assertVisible: { id: "add-country" }
- assertVisible: "Descargar tu país.*"
- assertNotVisible: "Melilla.*"
- takeScreenshot: 02-your-maps
- swipe: { direction: DOWN }
- tapOn: "Lugares guardados"
- assertVisible: "No hay lugares guardados.*"
