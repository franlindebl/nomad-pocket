# MAP-04 + MAP-09 — a country the maps catalog doesn't have (San Marino: the local
# catalogs only list Andorra) is extracted on the phone from the Protomaps build: the sheet estimates it, the download
# shows in "Tus mapas", installs as one row and is deleted with confirmation.
appId: com.fjlinde.nomadpocket
tags: [nightly, maps, network]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: "Elegir un país"
    timeout: 20000
- tapOn: "Elegir un país"
- tapOn: "Buscar un país"
- inputText: "San Marino"
- tapOn: { id: "country-sm" }
- extendedWaitUntil:
    visible: "Descargar · .*"
    timeout: 60000
- assertVisible: "Aún no disponible en este país.*"
- takeScreenshot: 01-estimate
- tapOn: "Descargar · .*"
- extendedWaitUntil:
    visible: { id: "country-row" }
    timeout: 10000
- extendedWaitUntil:
    visible: "(?s).*Mapa · .*"
    timeout: 180000
- takeScreenshot: 02-installed
- tapOn: { id: "region-delete" }
- assertVisible: "¿Eliminar San Marino.*"
# The row's delete button behind the alert has the same label: take the one above it.
- tapOn: { text: "Eliminar", above: { id: "region-delete" } }
- assertNotVisible: { id: "country-row" }
- assertVisible: "Descargar tu país.*"
