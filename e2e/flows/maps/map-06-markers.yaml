# MAP-06 + MAP-07 — long-press on the map adds a place; it is listed, can be edited and deleted.
appId: com.fjlinde.nomadpocket
tags: [full, maps]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: "Tus mapas"
    timeout: 20000
- longPressOn: { point: "50%,25%" }
- assertVisible: "Nuevo lugar"
- inputText: "Campamento"
- tapOn: "Guardar"
- tapOn: "Lugares guardados"
- assertVisible: "Campamento.*"
- takeScreenshot: 01-places
- longPressOn: "Campamento.*"
- tapOn: { id: "marker-note" }
- inputText: "Junto al río"
- tapOn: "Guardar"
- assertVisible: "(?s)Campamento.*Junto al río.*"
- tapOn: { id: "marker-delete" }
- assertVisible: "¿Eliminar «Campamento»\\?"
- tapOn: "Cancelar"
- assertVisible: "(?s)Campamento.*"
- tapOn: { id: "marker-delete" }
# The row's delete button behind the alert has the same label: take the one above it.
- tapOn: { text: "Eliminar", above: { id: "marker-delete" } }
- assertVisible: "No hay lugares guardados.*"
