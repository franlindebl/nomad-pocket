# MAP-18 — the OpenStreetMap credit shows over the map when it first appears and folds away by itself after ~5 s.
# iOS only for now: on Android the credit is mounted for its 5 s (traced) but the map hides it about a second after
# it draws, and Maestro never finds it (docs/PROGRESS.md, known issues, 2026-11-15).
appId: com.fjlinde.nomadpocket
tags: [full, maps, ios-only]
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/tab-maps.yaml
- extendedWaitUntil:
    visible: { id: "map-credit" }
    timeout: 15000
- assertVisible: "© Colaboradores de OpenStreetMap"
- takeScreenshot: 01-credit
- extendedWaitUntil:
    notVisible: { id: "map-credit" }
    timeout: 15000
