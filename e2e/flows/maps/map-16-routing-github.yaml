# MAP-16 — a country download with the published routing pack: the same path as MAP-15,
# but the routing catalog is a copy of the live routing-manifest.json and the Andorra pack
# (3 MB, built by .github/workflows/routing-packs.yml) downloads from GitHub Releases (the
# map still comes from the local catalog). Catches a broken release, a manifest the app
# can't read, or a CI-built pack the on-device engine rejects.
appId: com.fjlinde.nomadpocket
tags: [nightly, maps, routing-live, maps-server]
---
- setLocation:
    latitude: 42.5075
    longitude: 1.5218
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: { id: "map-search" }
    timeout: 20000
- tapOn: { id: "map-search" }
- inputText: "42.4637, 1.4913"
- tapOn: { id: "search-coordinates" }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-get-routing" }
    timeout: 30000
- tapOn: { id: "guidance-get-routing" }
- extendedWaitUntil:
    visible: { id: "country-download" }
    timeout: 20000
- assertVisible: "Andorra"
- assertVisible: "Rutas en coche, a pie y en bici.*"
- takeScreenshot: 01-country-sheet
- tapOn: { id: "country-download" }
- extendedWaitUntil:
    visible: { id: "guidance-next" }
    timeout: 180000
- takeScreenshot: 02-route
- tapOn: { id: "guidance-stop" }
- tapOn: { id: "map-emergency" }
- tapOn: { id: "emergency-cat-health" }
- extendedWaitUntil:
    visible: { id: "emergency-place" }
    timeout: 15000
- takeScreenshot: 03-emergency
