# MAP-15 — download a country (Andorra) from guidance: on a straight line the panel offers
# the navigation of this country, which opens the country sheet (map + navigation +
# points, sizes from the local catalogs scripts/e2e.sh serves for `routing-server` /
# `maps-server` flows). One download brings the map (two parts, reassembled) and the
# routing pack (two parts): guidance switches to roads, the pack's emergency points reach
# Emergencias, its street names, named places and house numbers the search, and "Tus mapas" lists one row for the country.
appId: com.fjlinde.nomadpocket
tags: [full, maps, routing-server, maps-server]
---
- setLocation:
    latitude: 42.5075
    longitude: 1.5218
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: { id: "map-search" }
    timeout: 20000
- tapOn: { id: "map-search" }
- inputText: "42.4637, 1.4913"
- tapOn: { id: "search-coordinates" }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-get-routing" }
    timeout: 30000
- tapOn: { id: "guidance-get-routing" }
- extendedWaitUntil:
    visible: { id: "country-download" }
    timeout: 20000
- assertVisible: "Andorra"
- assertVisible: "Navegación sin conexión"
- assertVisible: "Rutas en coche, a pie y en bici.*"
- assertVisible: { id: "country-size" }
- takeScreenshot: 01-country-sheet
- tapOn: { id: "country-download" }
- extendedWaitUntil:
    visible: { id: "guidance-next" }
    timeout: 90000
- takeScreenshot: 02-route
- tapOn: { id: "guidance-stop" }
- tapOn: "Tus mapas"
- extendedWaitUntil:
    visible: "(?s).*Mapa y navegación.*"
    timeout: 60000
- assertVisible: { id: "country-row" }
- takeScreenshot: 03-your-maps
- swipe: { direction: DOWN }
- tapOn: { id: "map-emergency" }
- tapOn: { id: "emergency-cat-health" }
- extendedWaitUntil:
    visible: "(?s).*Verge de Meritxell.*"
    timeout: 15000
- takeScreenshot: 04-emergency
- repeat:
    while:
      visible: { id: "emergency-place" }
    times: 6
    commands:
      - swipe:
          start: 50%, 40%
          end: 50%, 98%
          duration: 300
- tapOn: { id: "map-search" }
- inputText: "Bonaventura Armengol"
- extendedWaitUntil:
    visible: "(?s).*Carrer Bonaventura Armengol.*"
    timeout: 15000
- takeScreenshot: 05-street-search
- eraseText: 30
- inputText: "Comapedrosa"
- extendedWaitUntil:
    visible: "(?s).*Pic de Comapedrosa.*"
    timeout: 15000
- eraseText: 30
- inputText: "Avda Meritxell 86"
- extendedWaitUntil:
    visible: "(?s).*Avinguda Meritxell, 86.*"
    timeout: 15000
- assertVisible: "(?s).*Portal.*"
- takeScreenshot: 06-address
