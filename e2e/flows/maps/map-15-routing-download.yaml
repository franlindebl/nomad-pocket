# MAP-15 — download a routing pack (Andorra, two parts, from the local pack server that
# scripts/e2e.sh starts for `routing-server` flows): guidance on a straight line offers
# "Descargar rutas", the sheet lists the pack for this area, the download assembles the
# parts, guidance switches to roads, the pack's emergency points reach Emergencias and
# its street names the search (no map installed).
appId: com.fjlinde.nomadpocket
tags: [full, maps, routing-server]
---
- setLocation:
    latitude: 42.5075
    longitude: 1.5218
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: { id: "map-search" }
    timeout: 20000
- tapOn: { id: "map-search" }
- inputText: "42.4637, 1.4913"
- tapOn: { id: "search-coordinates" }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-get-routing" }
    timeout: 30000
- tapOn: { id: "guidance-get-routing" }
- extendedWaitUntil:
    visible: "Para esta zona"
    timeout: 20000
- assertVisible: "Andorra"
- takeScreenshot: 01-packs
- tapOn: { id: "pack-download", index: 0 }
- extendedWaitUntil:
    visible: { id: "pack-installed" }
    timeout: 60000
- takeScreenshot: 02-installed
- repeat:
    while:
      visible: { id: "pack-installed" }
    times: 6
    commands:
      - swipe:
          start: 50%, 40%
          end: 50%, 98%
          duration: 300
- extendedWaitUntil:
    visible: { id: "guidance-next" }
    timeout: 30000
- takeScreenshot: 03-route
- tapOn: { id: "guidance-stop" }
- tapOn: { id: "map-emergency" }
- tapOn: { id: "emergency-cat-health" }
- extendedWaitUntil:
    visible: "(?s).*Mitjavila.*"
    timeout: 15000
- takeScreenshot: 04-emergency
- repeat:
    while:
      visible: { id: "emergency-place" }
    times: 6
    commands:
      - swipe:
          start: 50%, 40%
          end: 50%, 98%
          duration: 300
- tapOn: { id: "map-search" }
- inputText: "Bonaventura Armengol"
- extendedWaitUntil:
    visible: "(?s).*Carrer Bonaventura Armengol.*"
    timeout: 15000
- takeScreenshot: 05-street-search
