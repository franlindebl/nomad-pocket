# MAP-13 — emergency points of a map that brought none (Melilla, a region map from an
# older version): a few from its own tiles at first (offline fallback); opening
# Emergencias online fetches the full set from OpenStreetMap (Overpass) by itself, with
# no button. Lists by category and distance, opens on the map and starts guidance.
appId: com.fjlinde.nomadpocket
tags: [nightly, maps, network, seeded-map]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "map" }
- extendedWaitUntil:
    visible: { id: "map-emergency" }
    timeout: 20000
- tapOn: { id: "map-emergency" }
- assertNotVisible: { id: "emergency-fetch-top" }
- takeScreenshot: 01-fetching
# Pharmacies are not in the z12 tiles: they arrive with the OpenStreetMap points.
- extendedWaitUntil:
    visible: "(?s).*Farmacia\\n.*"
    timeout: 240000
- takeScreenshot: 02-health
- tapOn: { id: "emergency-cat-security" }
- assertVisible: { id: "emergency-place" }
- assertVisible: "(?s).*(Policía|Guardia Civil|Bomberos).*"
- takeScreenshot: 03-security
- tapOn: { id: "emergency-place", index: 0 }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- takeScreenshot: 04-place-on-map
- tapOn: { id: "map-emergency" }
- tapOn: { id: "emergency-cat-security" }
- tapOn: { id: "emergency-guide", index: 0 }
- extendedWaitUntil:
    visible: { id: "guidance-panel" }
    timeout: 15000
- takeScreenshot: 05-guidance
