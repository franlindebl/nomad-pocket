# ANDROID-03 — map search, place card, straight-line guidance and Emergencias on Android:
# downloads a small country (Andorra: map extracted on the phone while the country maps
# catalog has none; its routing pack and emergency points from the published catalog).
appId: com.fjlinde.nomadpocket
tags: [android, network]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { point: "37%,93%" }   # Mapas
- extendedWaitUntil:
    visible: "Tus mapas"
    timeout: 20000
- setLocation: { latitude: 42.5075, longitude: 1.5218 }
- tapOn: "Tus mapas"
- tapOn: { id: "add-country" }
- tapOn: "Buscar un país"
- inputText: "Andorra"
- tapOn: { id: "country-ad" }
- extendedWaitUntil:
    visible: "Descargar · .*"
    timeout: 60000
- tapOn: "Descargar · .*"
# The runner keeps the emulator on mobile data: "Wi-Fi only" must ask before the country
# downloads (they wait for Wi-Fi otherwise).
- extendedWaitUntil:
    visible: "Descargas solo con Wi.Fi"
    timeout: 10000
- tapOn:
    text: "(?i)usar datos móviles"
- extendedWaitUntil:
    visible: "(?s).*Mapa( y navegación)? · .*"
    timeout: 300000
- back
- tapOn: { id: "map-search" }
- inputText: "Andorra la Vella"
- extendedWaitUntil:
    visible: { id: "search-result" }
    timeout: 60000
- takeScreenshot: 01-search
- tapOn: { id: "search-result", index: 0 }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- takeScreenshot: 02-place-card
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-panel" }
    timeout: 15000
- extendedWaitUntil:
    visible: "NoExiste"
    timeout: 4000
    optional: true
- takeScreenshot: 03-guidance
- tapOn: { id: "guidance-stop" }
- tapOn: { id: "map-emergency" }
- extendedWaitUntil:
    visible: "Llamar al 112"
    timeout: 15000
# The points come with the routing pack, or from Overpass when there is none.
- extendedWaitUntil:
    visible: { id: "emergency-place" }
    timeout: 240000
- takeScreenshot: 04-emergency
- tapOn: { id: "emergency-cat-security" }
- extendedWaitUntil:
    visible: "NoExiste"
    timeout: 2000
    optional: true
- takeScreenshot: 05-security
