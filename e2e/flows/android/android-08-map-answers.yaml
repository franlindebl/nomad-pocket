# ANDROID-08 — the assistant's map answers on Android (docs/ASSISTANT_MAP_PLAN.md), with no model: Andorra downloaded
# from the published catalog (as ANDROID-05), the phone in Andorra la Vella. A pharmacy near Sant Julià de Lòria is a
# map card (no health gate on Android: places on the map are general utility), "¿Dónde estoy?" says the town with the
# emergency button, and the nearest hospital opens the trip preview.
appId: com.fjlinde.nomadpocket
tags: [android, network]
---
- setLocation: { latitude: 42.5075, longitude: 1.5218 }
- runFlow: ../../subflows/launch.yaml
- tapOn: { point: "37%,93%" }   # Mapas
- extendedWaitUntil:
    visible: { id: "map-search" }
    timeout: 20000
- tapOn: { id: "map-search" }
- inputText: "42.4637, 1.4913"
- tapOn: { id: "search-coordinates" }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-get-routing" }
    timeout: 30000
- tapOn: { id: "guidance-get-routing" }
- extendedWaitUntil:
    visible: "Descargar · .*"
    timeout: 60000
- tapOn: { id: "country-download" }
- extendedWaitUntil:
    visible: "Descargas solo con Wi.Fi"
    timeout: 10000
- tapOn:
    text: "(?i)usar datos móviles"
- extendedWaitUntil:
    visible: { id: "guidance-next" }
    timeout: 300000
- tapOn: { id: "guidance-stop" }
- tapOn: { point: "88%,93%" }   # Asistente
- tapOn: "Pregunta .*"
- inputText: "Búscame una farmacia cerca de Sant Julià de Lòria"
- tapOn: "Enviar"
- extendedWaitUntil:
    visible: { id: "map-answer-row" }
    timeout: 60000
- assertVisible: "(?s).*cerca de Sant Julià de Lòria.*"
- takeScreenshot: 01-pharmacies
- tapOn: "Pregunta .*"
- inputText: "¿Dónde estoy?"
- tapOn: "Enviar"
- extendedWaitUntil:
    visible: { id: "map-answer-locality" }
    timeout: 30000
- assertVisible: { id: "map-answer-emergency" }
- takeScreenshot: 02-where-am-i
- tapOn: "Pregunta .*"
- inputText: "Llévame al hospital más cercano"
- tapOn: "Enviar"
- extendedWaitUntil:
    visible: { id: "map-answer-go-first" }
    timeout: 30000
- takeScreenshot: 03-nearest-hospital
- tapOn: { id: "map-answer-go-first" }
- extendedWaitUntil:
    visible: { id: "guidance-panel" }
    timeout: 30000
- takeScreenshot: 04-trip-preview
