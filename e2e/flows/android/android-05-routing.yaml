# ANDROID-05 — road routing on Android against the published catalog: the release APK
# reads routing-manifest.json from GitHub, downloads the Andorra pack (3 MB) from GitHub
# Releases, the engine routes on it and the pack's emergency points reach Emergencias.
appId: com.fjlinde.nomadpocket
tags: [android, network]
---
- setLocation: { latitude: 42.5075, longitude: 1.5218 }
- runFlow: ../../subflows/launch.yaml
- tapOn: { point: "50%,93%" }   # Mapas
- extendedWaitUntil:
    visible: { id: "map-search" }
    timeout: 20000
- tapOn: { id: "map-search" }
- inputText: "42.4637, 1.4913"
- tapOn: { id: "search-coordinates" }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-get-routing" }
    timeout: 30000
- tapOn: { id: "guidance-get-routing" }
- extendedWaitUntil:
    visible: "Para esta zona"
    timeout: 20000
- assertVisible: "(?s).*Andorra.*"
- takeScreenshot: 01-packs
- tapOn: { id: "pack-download", index: 0 }
- tapOn:
    text: "(?i)usar datos móviles"
    optional: true
- extendedWaitUntil:
    visible: { id: "pack-installed" }
    timeout: 120000
- takeScreenshot: 02-installed
- back
- extendedWaitUntil:
    visible: { id: "guidance-next" }
    timeout: 30000
- takeScreenshot: 03-route
- tapOn: { id: "guidance-stop" }
- tapOn: { id: "map-emergency" }
- tapOn: { id: "emergency-cat-health" }
- extendedWaitUntil:
    visible: { id: "emergency-place" }
    timeout: 15000
- takeScreenshot: 04-emergency
