# ANDROID-05 — road routing on Android against the published catalog: guidance offers
# Andorra's country download, which brings the routing pack (3 MB, routing-manifest.json
# and the pack from GitHub Releases) with the map; the engine routes on it and the pack's
# emergency points reach Emergencias.
appId: com.fjlinde.nomadpocket
tags: [android, network]
---
- setLocation: { latitude: 42.5075, longitude: 1.5218 }
- runFlow: ../../subflows/launch.yaml
- tapOn: { point: "37%,93%" }   # Mapas
- extendedWaitUntil:
    visible: { id: "map-search" }
    timeout: 20000
- tapOn: { id: "map-search" }
- inputText: "42.4637, 1.4913"
- tapOn: { id: "search-coordinates" }
- extendedWaitUntil:
    visible: { id: "place-card" }
    timeout: 10000
- tapOn: { id: "place-guide" }
- extendedWaitUntil:
    visible: { id: "guidance-get-routing" }
    timeout: 30000
- tapOn: { id: "guidance-get-routing" }
- extendedWaitUntil:
    visible: "Descargar · .*"
    timeout: 60000
- assertVisible: "Andorra"
- takeScreenshot: 01-country-sheet
- tapOn: { id: "country-download" }
# The runner keeps the emulator on mobile data: "Wi-Fi only" must ask before the country
# downloads (they wait for Wi-Fi otherwise).
- extendedWaitUntil:
    visible: "Descargas solo con Wi.Fi"
    timeout: 10000
- tapOn:
    text: "(?i)usar datos móviles"
- extendedWaitUntil:
    visible: { id: "guidance-next" }
    timeout: 300000
- takeScreenshot: 03-route
- tapOn: { id: "guidance-stop" }
- tapOn: { id: "map-emergency" }
- tapOn: { id: "emergency-cat-health" }
- extendedWaitUntil:
    visible: { id: "emergency-place" }
    timeout: 15000
- takeScreenshot: 04-emergency
