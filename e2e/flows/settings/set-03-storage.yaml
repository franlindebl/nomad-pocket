# SET-03 + SET-04 — storage lists installed items and deletes with confirmation; clearing reading history.
appId: com.fjlinde.nomadpocket
tags: [full, settings, seeded]
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/open-wikipedia.yaml
- tapOn: { id: "BackButton" }
- tapOn: { id: "house" }
# "Continuar" (recent reading) sits under the preparation checklist.
- scrollUntilVisible:
    element: "Continuar"
- scrollUntilVisible:
    element: { id: "open-settings" }
    direction: UP
- tapOn: { id: "open-settings" }
- scrollUntilVisible:
    element: "Documentación de Node.js.*"
- tapOn: "Documentación de Node.js.*"
- assertVisible: "¿Eliminar Documentación de Node.js\\?.*"
- tapOn: "Eliminar"
- assertNotVisible: "Documentación de Node.js.*"
- scrollUntilVisible:
    element: "Borrar historial de lectura"
- tapOn: "Borrar historial de lectura"
- assertVisible: "Historial borrado"
- tapOn: "OK"
# Close the sheet by its header (a swipe in the middle scrolls the list).
- swipe:
    start: 50%, 9%
    end: 50%, 95%
    duration: 300
- scrollUntilVisible:
    element: "Usas .*"
- assertNotVisible: "Continuar"
