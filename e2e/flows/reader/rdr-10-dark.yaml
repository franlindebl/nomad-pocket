# RDR-10 — the reader dark (the default) and on optional paper (visual check of the screenshots).
appId: com.fjlinde.nomadpocket
tags: [full, reader, seeded]
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/open-wikipedia.yaml
- tapOn: "Michael Jackson"
# Android's WebView doesn't hand the article's text to Maestro after a link (only the reader's own bar): wait for the
# article's title in the header there, and let the page draw.
- runFlow:
    when: { platform: iOS }
    commands:
      - extendedWaitUntil:
          visible: "Born"
          timeout: 10000
- runFlow:
    when: { platform: Android }
    commands:
      - extendedWaitUntil:
          visible: "Michael Jackson"
          timeout: 10000
      - waitForAnimationToEnd
- takeScreenshot: 01-reader-dark
# Paper page (optional, off by default): dark text on cream, and back to dark.
- tapOn: "Texto y fondo"
- tapOn: "Papel"
- tapOn: { id: "popover-dismiss" }
- takeScreenshot: 02-reader-paper
- tapOn: "Texto y fondo"
- tapOn: "Oscuro"
- tapOn: { id: "popover-dismiss" }
