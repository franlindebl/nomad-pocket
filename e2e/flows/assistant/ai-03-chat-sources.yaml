# AI-03 + AI-04 — system model (Apple Intelligence, iOS 27 simulator) answers from the library with
# source chips that open the reader. Asserts structure only: the answer text is not deterministic.
appId: com.fjlinde.nomadpocket
tags: [nightly, assistant, seeded]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "sparkles" }
- tapOn:   # the most capable model is already chosen since build 20: the button may not show
    text: "Usar modelo integrado"
    optional: true
- assertVisible: "¿En qué te ayudo\\?"
- tapOn: "Pregunta .*"
- inputText: "¿Quién fue Michael Jackson?"
- tapOn: "Enviar"
- extendedWaitUntil:
    visible: "FUENTES|Fuentes"
    timeout: 120000
- extendedWaitUntil:
    visible: "Enviar"
    timeout: 120000
- takeScreenshot: 01-answer
# B4: redirect pages ("Prince Michael Jackson" → "Michael Jackson") are one source, the article.
- assertVisible: "1\\. Michael Jackson"
- assertNotVisible: ".*Prince Michael Jackson.*"
# First tap on non-interactive text only dismisses the keyboard.
- tapOn: "FUENTES|Fuentes"
- tapOn: "1\\. .*"
- extendedWaitUntil:
    visible: "Buscar en este libro"
    timeout: 15000
- takeScreenshot: 02-source-in-reader
