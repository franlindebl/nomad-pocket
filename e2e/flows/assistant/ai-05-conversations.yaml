# AI-05 — a chat is listed under Today in Conversations and can be deleted with confirmation.
appId: com.fjlinde.nomadpocket
tags: [nightly, assistant]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "text.bubble" }
- tapOn:   # the most capable model is already chosen since build 20: the button may not show
    text: "Usar modelo integrado"
    optional: true
- tapOn: { id: "assistant-suggestion-0" }   # the suggestions rotate: whichever is in the first card
- extendedWaitUntil:
    visible: "Enviar"
    timeout: 120000
- tapOn: "Conversaciones"
- assertVisible: "Hoy|HOY"
- takeScreenshot: 01-conversations
- tapOn: { id: "conversation-delete" }
- tapOn: "Eliminar"
- assertVisible: "Aún no hay conversaciones"
