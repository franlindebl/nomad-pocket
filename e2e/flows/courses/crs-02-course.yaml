# CRS-02 + CRS-03 + CRS-04 — seeded course: syllabus, start in the reader, mark a lesson done/undone, reset progress.
appId: com.fjlinde.nomadpocket
tags: [full, courses, seeded]
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/open-courses.yaml
- assertVisible: "freeCodeCamp en español.*"
- tapOn: "freeCodeCamp en español.*"
- extendedWaitUntil:
    visible: { id: "lesson-check-1" }
    timeout: 30000
- takeScreenshot: 01-syllabus
- tapOn: { id: "lesson-check-1" }
- assertVisible: { id: "lesson-check-1", text: "Marcar como pendiente" }
- tapOn: { id: "lesson-check-1" }
- assertVisible: { id: "lesson-check-1", text: "Marcar como hecha" }
# Long-press on the lesson toggles it too.
- longPressOn: { id: "lesson-2" }
- assertVisible: { id: "lesson-check-2", text: "Marcar como pendiente" }
- tapOn: "Reiniciar progreso"
- assertVisible: "Se borrará tu progreso en este curso."
# The alert's button: its title and the screen's link have the same text.
- tapOn: { text: "Reiniciar progreso", below: "Se borrará.*", above: "Cancelar" }
- assertVisible: { id: "lesson-check-2", text: "Marcar como hecha" }
- tapOn: "Empezar curso"
- extendedWaitUntil:
    visible: "Buscar en este libro"
    timeout: 15000
# JS-app lesson: blank for a few seconds while it boots (no loading indicator).
- extendedWaitUntil:
    visible: "Los comentarios son líneas.*"
    timeout: 30000
- takeScreenshot: 02-lesson
- tapOn: { id: "BackButton" }
- assertVisible: "Continuar"
