# PREP-01 — Home's "Mi plan familiar" opens the family plan; it keeps contacts, a meeting point, health and home notes.
appId: com.fjlinde.nomadpocket
tags: [smoke, prepare]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "home-plan" }
- assertVisible: "Puntos de encuentro"
- takeScreenshot: 01-plan-empty
- tapOn: { id: "add-contact" }
- assertVisible: "Nuevo contacto"
- inputText: "Ana López"
- tapOn: { id: "entry-relation" }
- inputText: "Hermana"
- tapOn: { id: "entry-phone" }
- inputText: "600123456"
- tapOn: { id: "entry-save" }
- assertVisible: "Ana López.*"
- assertVisible: ".*Hermana · 600123456.*"
- assertVisible: { id: "call-contact-0" }
- tapOn: { id: "meeting-primary" }
- tapOn: { id: "meeting-place" }
- inputText: "Puerta del colegio"
- tapOn: { id: "meeting-details" }
- inputText: "A las 18:00"
- tapOn: { id: "meeting-save" }
- assertVisible: ".*Puerta del colegio · A las 18:00.*"
- scrollUntilVisible:
    element: { id: "add-person" }
- tapOn: { id: "add-person" }
- inputText: "Lucas"
- tapOn: { id: "entry-allergies" }
- inputText: "Penicilina"
- tapOn: { id: "entry-save" }
- assertVisible: "Lucas.*"
- assertVisible: ".*Penicilina.*"
- scrollUntilVisible:
    element: { id: "home-notes" }
- tapOn: { id: "home-notes" }
- inputText: "Llave de paso bajo el fregadero"
# Not hideKeyboard: Maestro's dismiss gesture can land on "Añadir número" and open its sheet.
# Tapping the section title (not pressable) ends editing.
- tapOn: "NOTAS DE CASA"
- takeScreenshot: 02-plan-filled
# Edit and delete: the contact sheet opens with its values.
- scrollUntilVisible:
    element: "Ana López.*"
    direction: UP
- tapOn: "Ana López.*"
- assertVisible: "Editar contacto"
- tapOn: "Eliminar"
- assertNotVisible: "Ana López.*"
- tapOn: { id: "BackButton" }
# Home's checklist counts the plan as ready.
- scrollUntilVisible:
    element: { id: "ready-plan" }
- assertVisible: ".*Punto de encuentro.*"
