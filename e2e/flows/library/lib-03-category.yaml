# LIB-03 — a collection lists every level with its resources and confirms before downloading one level.
appId: com.fjlinde.nomadpocket
tags: [full, library]
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/tab-library.yaml
# Medicine on iOS; Android has no health collections (src/lib/health.ts), so Survival there, laid out the same way.
- evalScript: "${output.collection = maestro.platform === 'android' ? 'survival' : 'medicine'}"
- runFlow:
    when: { platform: Android }
    commands:
      - assertNotVisible: { id: "collection-medicine" }
- tapOn: { id: "collection-${output.collection}" }
- assertVisible: "Nivel 1 · Esencial|NIVEL 1 · ESENCIAL"
- tapOn: { id: "pack-download-${output.collection}-essential" }
- assertVisible: "¿Descargar .*"
- takeScreenshot: 01-pack-confirm
- tapOn: "Cancelar"
- assertVisible: "Descargar nivel · .*"
- scrollUntilVisible:
    element: "Nivel 3 · Completo|NIVEL 3 · COMPLETO"
    direction: DOWN
