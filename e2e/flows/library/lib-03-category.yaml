# LIB-03 — a collection lists every level with its resources and confirms before downloading one level.
appId: com.fjlinde.nomadpocket
tags: [full, library]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "books.vertical" }
- tapOn: "Medicina.*"
- assertVisible: "Nivel 1 · Esencial|NIVEL 1 · ESENCIAL"
- tapOn: { id: "pack-download-medicine-essential" }
- assertVisible: "¿Descargar .*"
- takeScreenshot: 01-pack-confirm
- tapOn: "Cancelar"
- assertVisible: "Descargar nivel · .*"
- scrollUntilVisible:
    element: "Nivel 3 · Completo|NIVEL 3 · COMPLETO"
    direction: DOWN
