# LIB-02 + LIB-05 — long-press on an installed archive (in its collection's level, or Wikipedia's list) offers Share and Delete; Delete asks
# first: Cancel keeps it, Delete removes it; the collections count it out. (The seeded course stays, so
# the Library's empty state doesn't show: the courses collection still has it. It is freeCodeCamp, which
# Computing lists too, so Computing still counts 1.)
appId: com.fjlinde.nomadpocket
tags: [smoke, library, seeded]
---
- runFlow: ../../subflows/launch.yaml
- tapOn: { id: "books.vertical" }
- scrollUntilVisible:
    element: { id: "collection-computing" }
    centerElement: true
- tapOn: { id: "collection-computing" }
# Installed archives sit in their level, as catalog rows; deleting one turns its button back to Download.
- scrollUntilVisible:
    element: "Documentación de Node.js.*"
    centerElement: true
- longPressOn: "Documentación de Node.js.*"
- assertVisible: "Compartir"
- tapOn: "Eliminar"
- assertVisible: "¿Eliminar Documentación de Node.js\\?.*"
- tapOn: "Cancelar"
- assertVisible: { id: "download-devdocs_en_node", text: "Abrir.*|.*Abrir" }
- longPressOn: "Documentación de Node.js.*"
- tapOn: "Eliminar"
- tapOn: "Eliminar"
- assertVisible: { id: "download-devdocs_en_node", text: "Descargar.*" }
- scrollUntilVisible:
    element: "1 de 17 en tu dispositivo.*|1 DE 17 EN TU DISPOSITIVO.*"
    direction: UP
- tapOn: { id: "BackButton" }
- scrollUntilVisible:
    element: { id: "collection-wikipedia" }
    direction: UP
    centerElement: true
- tapOn: { id: "collection-wikipedia" }
- longPressOn: "Wikipedia 100.*"
- tapOn: "Eliminar"
- tapOn: "Eliminar"
- tapOn: { id: "BackButton" }
- scrollUntilVisible:
    element: { id: "collection-medicine" }
    direction: UP
    centerElement: true
- tapOn: { id: "collection-medicine" }
- scrollUntilVisible:
    element: ".*NHS.*|.*[Mm]edicines.*"
    centerElement: true
- longPressOn: ".*NHS.*|.*[Mm]edicines.*"
- tapOn: "Eliminar"
- tapOn: "Eliminar"
- tapOn: { id: "BackButton" }
- scrollUntilVisible:
    element: "Medicina, 0 de .*"
    direction: UP
- scrollUntilVisible:
    element: "Informática y tecnología, 1 de .*"
    centerElement: true
- takeScreenshot: 01-library-after-delete
