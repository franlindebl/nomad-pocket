# Opens Courses, a section of the Library tab.
appId: com.fjlinde.nomadpocket
---
- tapOn: { id: "books.vertical" }
- scrollUntilVisible:
    element: { id: "collection-courses" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "collection-courses" }
- extendedWaitUntil:
    visible: "Mis cursos"
    timeout: 10000
